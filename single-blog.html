<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="seo-title">Blog Post | Ashish Web Solutions</title>
    <meta id="seo-desc" name="description" content="Read our latest insights and articles.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #09090b; 
            color: #e4e4e7; 
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom Typography for Markdown Content */
        .blog-content h1, .blog-content h2 { font-size: 2rem; font-weight: 800; color: #ffffff; margin-top: 3rem; margin-bottom: 1.25rem; letter-spacing: -0.025em; }
        .blog-content h3 { font-size: 1.5rem; font-weight: 700; color: #ffffff; margin-top: 2rem; margin-bottom: 1rem; }
        .blog-content p { margin-bottom: 1.5rem; color: #a1a1aa; line-height: 1.8; font-size: 1.125rem; font-weight: 300; }
        .blog-content ul { list-style-type: none; padding-left: 0; color: #a1a1aa; margin-bottom: 1.5rem; font-size: 1.125rem; font-weight: 300; }
        .blog-content ul li { margin-bottom: 0.75rem; position: relative; padding-left: 1.5rem; }
        .blog-content ul li::before { content: '•'; color: #f97316; position: absolute; left: 0; font-weight: bold; font-size: 1.5rem; line-height: 1; top: -2px; }
        
        /* Table Styling */
        .blog-content table { width: 100%; text-align: left; border-collapse: collapse; background: rgba(255,255,255,0.03); font-size: 1rem; margin: 2rem 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; overflow: hidden; }
        .blog-content th { background: rgba(255,255,255,0.08); color: #f97316; padding: 1rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .blog-content td { padding: 1rem; color: #cbd5e1; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .blog-content tr:hover { background: rgba(255,255,255,0.05); }
        
        .blog-content blockquote { border-left: 4px solid #f97316; padding: 1.5rem; font-style: italic; color: #e4e4e7; margin: 2.5rem 0; background: rgba(249,115,22,0.05); border-radius: 0 1rem 1rem 0; font-size: 1.25rem; line-height: 1.6; }
        .blog-content a { color: #f97316; text-decoration: underline; text-underline-offset: 4px; }
        .blog-content a:hover { color: #ffffff; }
    </style>
</head>
<body class="antialiased selection:bg-orange-500 selection:text-white">

    <header class="fixed top-0 left-0 w-full z-50 transition-all duration-300 backdrop-blur-md bg-black/60 border-b border-white/10" id="navbar">
        <div class="max-w-7xl mx-auto px-6 lg:px-12">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer">
                    <a href="index.html" class="text-2xl md:text-3xl font-extrabold tracking-widest uppercase flex items-center gap-1 group">
                        <span class="text-white group-hover:text-gray-300 transition-colors">Ashish</span>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-orange-600">Studio</span>
                    </a>
                </div>
                <nav class="hidden md:flex space-x-6 lg:space-x-10 items-center">
                    <a href="index.html" class="text-gray-300 hover:text-white px-1 py-2 text-sm font-semibold tracking-wider uppercase transition-colors relative group">Home</a>
                    <a href="blog.html" class="text-orange-500 px-1 py-2 text-sm font-semibold tracking-wider uppercase relative group">Blog</a>
                    <a href="contact.html" class="text-gray-300 hover:text-white px-1 py-2 text-sm font-semibold tracking-wider uppercase transition-colors relative group">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <main id="single-post-container" class="min-h-screen"></main>

    <footer class="bg-black border-t border-white/5 pt-16 pb-8 text-center">
        <p class="text-gray-600 text-sm">© 2026 Ashish Web Solutions. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRH2yH709LAwF4N6xTiqI91WGikcWqw49QFr7_gZjuSH2kqli9Vd3_duAUIcYa4RDGvWKsxl9OhLA5_/pub?output=csv";
        const singlePostContainer = document.getElementById('single-post-container');

        if (singlePostContainer) {
            singlePostContainer.innerHTML = '<div class="pt-40 pb-24 text-center text-white text-xl">Loading blog content...</div>';

            const urlParams = new URLSearchParams(window.location.search);
            const currentBlogId = urlParams.get('id');

            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const blogsDatabase = results.data;
                    const blogData = blogsDatabase.find(blog => blog.id === currentBlogId);

                    if (blogData) {
                        document.title = blogData.title + " | Ashish Web Solutions";
                        document.getElementById('seo-title').innerText = blogData.title;
                        document.getElementById('seo-desc').setAttribute('content', blogData.shortDesc);

                        const formattedContent = marked.parse(blogData.content);

                        singlePostContainer.innerHTML = `
                            <section class="pt-32 pb-12 relative overflow-hidden bg-black">
                                <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-orange-600/10 rounded-full blur-[150px] pointer-events-none"></div>
                                <div class="max-w-4xl mx-auto px-6 relative z-10 text-center reveal active">
                                    <div class="flex items-center justify-center gap-2 text-sm text-gray-500 font-medium mb-8 uppercase tracking-widest">
                                        <a href="index.html" class="hover:text-orange-500 transition-colors">Home</a>
                                        <span>/</span>
                                        <a href="blog.html" class="hover:text-orange-500 transition-colors">Blog</a>
                                        <span>/</span>
                                        <span class="text-orange-500">${blogData.category}</span>
                                    </div>
                                    <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight text-white mb-8 leading-tight">
                                        ${blogData.title}
                                    </h1>
                                    <div class="flex items-center justify-center gap-6 text-gray-400 text-sm">
                                        <div><p class="text-white font-bold">${blogData.author}</p></div>
                                        <div class="h-8 w-px bg-white/10"></div>
                                        <div><span>${blogData.date}</span></div>
                                        <div class="h-8 w-px bg-white/10 hidden sm:block"></div>
                                        <div class="hidden sm:block"><span>${blogData.readTime}</span></div>
                                    </div>
                                </div>
                            </section>

                            <section class="max-w-6xl mx-auto px-6 relative z-10 reveal active delay-100 -mt-4">
                                <div class="w-full aspect-video md:aspect-[21/9] rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
                                    <img src="${blogData.image}" alt="${blogData.title}" class="w-full h-full object-cover">
                                </div>
                            </section>

                            <section class="py-16 bg-zinc-950 relative z-10">
                                <div class="max-w-4xl mx-auto px-6">
                                    <article class="w-full blog-content reveal active">
                                        ${formattedContent}
                                    </article>

                                    <div class="mt-16 p-8 glass-card rounded-3xl flex flex-col sm:flex-row items-center gap-6 reveal active border-l-4 border-l-orange-500 bg-white/5">
                                        <div class="flex-shrink-0">
                                            <img src="https://ui-avatars.com/api/?name=${blogData.author}&background=f97316&color=000&size=120&font-size=0.4&bold=true" alt="${blogData.author}" class="w-20 h-20 rounded-full border-2 border-orange-500 shadow-[0_0_15px_rgba(249,115,22,0.3)]">
                                        </div>
                                        <div class="text-center sm:text-left">
                                            <h4 class="text-xl font-bold text-white mb-2">Written by <span class="text-orange-500">${blogData.author}</span></h4>
                                            <p class="text-gray-400 text-sm leading-relaxed">Expert in Web Development & SEO. Passionate about helping businesses grow their online presence with fast, modern, and high-ranking digital solutions.</p>
                                        </div>
                                    </div>

                                </div>
                            </section>
                        `;
                    } else {
                        singlePostContainer.innerHTML = `
                            <div class="pt-40 pb-24 text-center">
                                <h1 class="text-6xl font-bold text-white mb-4">404</h1>
                                <p class="text-xl text-red-500 mb-8">Blog post not found.</p>
                                <a href="blog.html" class="bg-orange-500 text-black px-8 py-3 rounded-full font-bold uppercase tracking-widest">Back to Blogs</a>
                            </div>
                        `;
                    }

                    setTimeout(() => {
                        const observer = new IntersectionObserver((entries) => {
                            entries.forEach(entry => {
                                if (entry.isIntersecting) entry.target.classList.add('active');
                            });
                        });
                        document.querySelectorAll('.reveal').forEach((element) => observer.observe(element));
                    }, 100);
                }
            });
        }
    </script>
</body>
</html>
